<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大魔王库存监控</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 大魔王库存监控</h1>
      <p class="subtitle">Daimaoh Stock Monitor</p>
    </header>

    <div class="url-input-section">
      <label for="url-input">输入商品页面URL:</label>
      <div class="url-input-row">
        <input type="text" id="url-input" placeholder="https://daimaoh.co.jp/item5457.html">
        <button id="check-url-btn" class="btn-small">检查</button>
      </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
      <div class="spinner"></div>
      <p>正在抓取库存数据...</p>
    </div>

    <div id="error" class="error" style="display:none;">
      <p>⚠️ <span id="error-message"></span></p>
    </div>

    <div id="results" class="results" style="display:none;">
      <div id="product-list"></div>
    </div>

    <div class="preset-products">
      <h4>快速检查（按系列）:</h4>
      <div class="preset-section">
        <span class="preset-label">Muses:</span>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item5457.html">Fillo</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item5458.html">Kokalo</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item5456.html">Arkhe</button>
      </div>
      <div class="preset-section">
        <span class="preset-label">Venus:</span>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item1663.html">Real</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item1608.html">Clone</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item1662.html">Cross</button>
      </div>
      <div class="preset-section">
        <span class="preset-label">Virgo:</span>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item12261.html">Phantasma</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item12262.html">Veritas</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item12263.html">Liber</button>
      </div>
      <div class="preset-section">
        <span class="preset-label">Lilith:</span>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item2285.html">Spiral-wave</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item2286.html">Spiral-dots</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item2287.html">Uterus</button>
      </div>
      <div class="preset-section">
        <span class="preset-label">其他:</span>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item1824.html">Quty Tits</button>
        <button class="preset-btn" data-url="https://daimaoh.co.jp/item3420.html">TSUBO2.0</button>
      </div>
    </div>

    <footer>
      <button id="refresh-btn" class="btn">🔄 刷新全部</button>
      <button id="toggle-history" class="btn btn-secondary">📋 历史</button>
    </footer>

    <div id="history" class="history" style="display:none;">
      <h3>📋 监控历史</h3>
      <div id="history-list"></div>
      <button id="clear-history" class="btn-text">🗑️ 清除历史</button>
    </div>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
